[project]
name = "l1"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "fastapi[standard]>=0.136.3",
    "flower>=2.0.1",
    "multidict>=6.7.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Небольшой baseline для учебного проекта: синтаксис, импорты и явные ошибки.
# Правила I/UP можно включить отдельным изменением после форматирования старого кода.
select = ["E4", "E7", "E9", "F"]
